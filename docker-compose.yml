version: "3.8"

services:
  cuida-db:
    image: postgres:15-alpine
    container_name: cuida-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: cuida
    volumes:
      - pgdata_cuida:/var/lib/postgresql/data

volumes:
  pgdata_cuida: